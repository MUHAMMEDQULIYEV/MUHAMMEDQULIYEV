<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProductivityHub</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#4f46e5', dark: '#4338ca' },
          }
        }
      }
    }
  </script>

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Plotly CDN -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex" x-data="appState()">

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed inset-y-0 left-0 z-30 w-64 bg-gray-900 border-r border-gray-800 flex flex-col shadow-xl
           md:relative md:translate-x-0 transition-transform duration-300"
    :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">

    <!-- Logo -->
    <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-800">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">P</div>
      <span class="font-bold text-lg text-white">ProductivityHub</span>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
      <template x-for="item in navItems" :key="item.id">
        <button
          @click="navigate(item.id); sidebarOpen = false"
          class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all"
          :class="currentPage === item.id
            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/20'
            : 'text-gray-400 hover:text-white hover:bg-gray-800'">
          <span class="text-lg" x-text="item.icon"></span>
          <span x-text="item.label"></span>
        </button>
      </template>
    </nav>

    <!-- Dark mode toggle -->
    <div class="px-6 py-4 border-t border-gray-800">
      <button @click="toggleDark()"
        class="flex items-center gap-2 text-sm text-gray-400 hover:text-white transition-colors">
        <span x-text="darkMode ? '☀️' : '🌙'"></span>
        <span x-text="darkMode ? 'Light Mode' : 'Dark Mode'"></span>
      </button>
    </div>
  </aside>

  <!-- Mobile overlay -->
  <div x-show="sidebarOpen"
    @click="sidebarOpen = false"
    class="fixed inset-0 z-20 bg-black/50 md:hidden"
    x-transition.opacity></div>

  <!-- Main content area -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Top bar -->
    <header class="bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center gap-4">
      <button @click="sidebarOpen = !sidebarOpen"
        class="md:hidden text-gray-400 hover:text-white p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h1 class="text-lg font-semibold text-white" x-text="pageTitle"></h1>
      <div class="ml-auto flex items-center gap-2">
        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        <span class="text-xs text-gray-400">Connected</span>
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto p-6" id="page-content">
      <div id="dashboard-page"  class="page hidden"></div>
      <div id="tasks-page"      class="page hidden"></div>
      <div id="notes-page"      class="page hidden"></div>
      <div id="flashcards-page" class="page hidden"></div>
      <div id="language-page"   class="page hidden"></div>
      <div id="analytics-page"  class="page hidden"></div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2 pointer-events-none"></div>

  <!-- Modal container -->
  <div id="modal-container"></div>

  <!-- JS Modules -->
  <script src="/js/api.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/tasks.js"></script>
  <script src="/js/pages/notes.js"></script>
  <script src="/js/pages/flashcards.js"></script>
  <script src="/js/pages/language.js"></script>
  <script src="/js/pages/analytics.js"></script>
  <script src="/js/app.js"></script>

  <script>
    function appState() {
      return {
        currentPage: 'dashboard',
        sidebarOpen: false,
        darkMode: true,
        navItems: [
          { id: 'dashboard',  icon: '🏠', label: 'Dashboard'  },
          { id: 'tasks',      icon: '✅', label: 'Tasks'       },
          { id: 'notes',      icon: '📝', label: 'Notes'       },
          { id: 'flashcards', icon: '🃏', label: 'Flashcards'  },
          { id: 'language',   icon: '🌐', label: 'Language'    },
          { id: 'analytics',  icon: '📊', label: 'Analytics'   },
        ],
        get pageTitle() {
          const item = this.navItems.find(n => n.id === this.currentPage);
          return item ? `${item.icon} ${item.label}` : 'ProductivityHub';
        },
        navigate(page) {
          this.currentPage = page;
          document.querySelectorAll('.page').forEach(el => el.classList.add('hidden'));
          const target = document.getElementById(`${page}-page`);
          if (target) {
            target.classList.remove('hidden');
            window.loadPage && window.loadPage(page, target);
          }
        },
        toggleDark() {
          this.darkMode = !this.darkMode;
          document.documentElement.classList.toggle('dark', this.darkMode);
        },
        init() {
          this.navigate('dashboard');
        }
      };
    }
  </script>
</body>
</html>
